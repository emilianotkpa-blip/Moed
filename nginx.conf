# Sitio de MOËD · Wedding & Events — nginx dentro del contenedor (puerto 80)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # La pagina se revisa siempre: el modo edicion publica cambios en
    # index.html y deben verse al momento, sin cache vieja
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Lo que genera Astro lleva su huella en el nombre: no cambia nunca
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Las paginas del sitio anterior ahora son secciones de la portada
    location ~ ^/servicios(/.*)?$ { return 301 /#servicios; }
    location ~ ^/portafolio/?$    { return 301 /#momentos; }
    location ~ ^/contacto/?$      { return 301 /#contacto; }
    location ~ ^/(equipo|landing)/?$ { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
    }
}
